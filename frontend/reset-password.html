<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080D">
  <meta name="description" content="CHILLFLIX: your world of Asian entertainment.">
  <title>Choose a new password · CHILLFLIX</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-mode="reset">
  <main class="auth-wrap">
    <div class="auth-card">
      <form id="authForm" novalidate>
        <h1>Choose a new password</h1><p class="sub">Pick something you haven't used before.</p>
      <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><span class=hint>At least 8 characters with letters and numbers.</span></div>
      <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
        <p class="form-error" id="formError" role="alert"></p>
        <button class="btn btn-primary" id="submit">Update password</button>
        <div class="auth-links"><a href="login.html">Back to log in</a></div>
      </form>
      <div id="done" hidden><h1>Password updated</h1><p class="sub" id="doneText"></p><div id="devLink"></div><p style="margin-top:16px"><a class="btn btn-primary" href="login.html">Go to log in</a></p></div>
    </div>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
