<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080D">
  <meta name="description" content="CHILLFLIX: your world of Asian entertainment.">
  <title>Welcome back · CHILLFLIX</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-mode="login">
  <main class="auth-wrap">
    <div class="auth-card">
      <form id="authForm" novalidate>
        <h1>Welcome back</h1><p class="sub">Log in to continue watching.</p>
      <div class="field"><label for="identifier">Email or username</label><input id="identifier" name="identifier" type="text" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <p class="form-error" id="formError" role="alert"></p>
        <button class="btn btn-primary" id="submit">Log in</button>
        <div class="auth-links"><a href="forgot-password.html">Forgot password?</a><span>New here? <a href="register.html">Create an account</a></span></div>
      </form>
      <div id="done" hidden></div>
    </div>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
