<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080D">
  <meta name="description" content="CHILLFLIX: your world of Asian entertainment.">
  <title>Reset your password · CHILLFLIX</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-mode="forgot">
  <main class="auth-wrap">
    <div class="auth-card">
      <form id="authForm" novalidate>
        <h1>Reset your password</h1><p class="sub">Enter your email and we'll send you a reset link.</p>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <p class="form-error" id="formError" role="alert"></p>
        <button class="btn btn-primary" id="submit">Send reset link</button>
        <div class="auth-links"><a href="login.html">Back to log in</a></div>
      </form>
      <div id="done" hidden><h1>Check your inbox</h1><p class="sub" id="doneText"></p><div id="devLink"></div><p style="margin-top:16px"><a class="btn btn-primary" href="login.html">Go to log in</a></p></div>
    </div>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
